<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Consulta de Horários Semanais - IFRO</title>

<link rel="stylesheet" href="style.css">

<!-- libs externas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

</head>

<body>

<!-- ================= HEADER FIXO ================= -->
<header class="ifro-header-fixed">
  <div class="ifro-header-content">
    <div class="ifro-linha1">INSTITUTO FEDERAL DE EDUCAÇÃO, CIÊNCIA E TECNOLOGIA DE RONDÔNIA - IFRO</div>
    <div class="ifro-linha2">CAMPUS CACOAL</div>
    <div class="ifro-linha3">DEPARTAMENTO DE APOIO AO ENSINO</div>
    <div class="ifro-linha4">HORÁRIOS SEMANAIS - 2026</div>
  </div>
</header>

<!-- ================= ABAS ================= -->
<nav class="tabs">

  <button class="tab active" data-tab="horarios" onclick="abrirAba('horarios')">
    Horários
  </button>

  <button class="tab" data-tab="sabados" onclick="abrirAba('sabados')">
    Sábados Letivos
  </button>

  <button class="tab" data-tab="professor" onclick="abrirAba('professor')">
    Professor
  </button>

  <button class="tab" data-tab="turma" onclick="abrirAba('turma')">
    Turma
  </button>

</nav>

<!-- ================= CONTEÚDO ================= -->
<main class="tab-container">

<!-- ================= ABA HORÁRIOS ================= -->
<section id="aba-horarios" class="tab-content">

  <div class="controls-card">

    <select id="selectModalidade" onchange="trocarModalidade()">
      <option value="INTEGRADO">INTEGRADO</option>
      <option value="SUPERIOR">SUPERIOR</option>
    </select>

    <select id="selectSemana" onchange="trocarSemana()"></select>

    <input type="text"
           id="searchProf"
           class="search-box"
           placeholder="🔍 Buscar Professor..."
           onkeyup="filtrarProfessor(); gerarPreviewProfessor();">

    <button class="btn-pdf" onclick="exportarPDF()">
      📄 PDF Horários
    </button>

  </div>

  <div class="week-container">

    <div id="botoesRelatorio"></div>
    <div id="painelAlteracoes"></div>

    <!-- 🔥 PAINEL DE RELATÓRIO (OBRIGATÓRIO PARA NÃO QUEBRAR JS) -->
    <div id="painelVagas"
         style="display:none;
                padding:12px;
                background:#ffffff;
                border:1px solid #ddd;
                margin-top:10px;
                border-radius:8px;">

      <strong>📄 Relatório</strong>

      <pre id="conteudoVagas"
           style="white-space:pre-wrap;
                  margin-top:10px;
                  font-size:13px;
                  line-height:1.4;">
      </pre>

    </div>

    <div class="table-responsive" id="tabelaHorario"></div>

  </div>

</section>

<!-- ================= ABA SÁBADOS ================= -->
<section id="aba-sabados" class="tab-content" style="display:none;">

  <div class="controls-card">

    <select id="selectModalidadeSabados" onchange="renderSabados()">
      <option value="INTEGRADO">INTEGRADO</option>
      <option value="SUPERIOR">SUPERIOR</option>
    </select>

    <input type="text"
           id="searchSabados"
           class="search-box"
           placeholder="🔍 Professor ou turma..."
           onkeyup="renderSabados()">

    <button class="btn-pdf" onclick="exportarPDFSabados()">
      📄 PDF Sábados
    </button>

  </div>

  <div id="containerSabados"></div>

</section>

<!-- ================= ABA PROFESSOR ================= -->
<section id="aba-professor" class="tab-content" style="display:none;">

  <div class="controls-card">

    <select id="selectProfessor" onchange="renderProfessor()"></select>

    <select id="selectSemanaProfessor" onchange="renderProfessor()"></select>

    <button class="btn-pdf" onclick="exportarPDFProfessor()">
      📄 PDF Professor
    </button>

  </div>

  <div id="fichaProfessor"></div>

</section>

<!-- ================= ABA TURMA ================= -->
<section id="aba-turma" class="tab-content" style="display:none;">

  <div class="controls-card">

    <select id="selectTurma" onchange="renderTurma()"></select>

    <select id="selectSemanaTurma" onchange="renderTurma()"></select>

    <button class="btn-pdf" onclick="exportarPDFTurma()">
      📄 PDF Turma
    </button>

  </div>

  <div id="fichaTurma"></div>

</section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="ifro-footer">
  IFRO - Campus Cacoal<br>
  BR 364, Km 228, Lote 2-A - Zona Rural<br>
  ☎ (69) 3443-2445 | ✉ dape.cacoal@ifro.edu.br
</footer>

<!-- ================= SCRIPTS (ORDEM CORRIGIDA) ================= -->

<!-- 1. utils (base) -->
<script src="js/utils.js"></script>

<!-- 2. core (OBRIGATÓRIO - abas e estado global) -->
<script src="js/core.js"></script>

<!-- 3. app (dados e init) -->
<script src="js/app.js"></script>

<!-- 4. módulos de lógica -->
<script src="js/alteracoes.js"></script>
<script src="js/comparador.js"></script>
<script src="js/relatorios.js"></script>
<script src="js/professores.js"></script>
<script src="js/turmas.js"></script>

<!-- 5. render (UI principal) -->
<script src="js/render.js"></script>

<!-- 6. exportação -->
<script src="js/pdf.js"></script>

<!-- 7. eventos finais -->
<script src="js/eventos.js"></script>

</body>
</html>
